name: Publish Docker Images (CD)

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/raceday-api
  IMAGE_NAME_MVC: ${{ github.repository }}/raceday-mvc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}

      - name: Extract metadata for MVC
        id: meta-mvc
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MVC }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./RaceDay.Api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build and push MVC image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./RaceDay.Mvc/Dockerfile
          push: true
          tags: ${{ steps.meta-mvc.outputs.tags }}
          labels: ${{ steps.meta-mvc.outputs.labels }}
