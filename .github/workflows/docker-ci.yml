name: Docker Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API Docker image
        run: docker build -f RaceDay.Api/Dockerfile -t raceday-api:test .

      - name: Build the MVC Docker image
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:test .

      - name: Validate Docker Compose configuration
        run: docker compose config
