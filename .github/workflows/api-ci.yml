name: RaceDay.Api CI

on:
  push:
    branches: [main]
    paths:
      - 'RaceDay.Api/**'
      - 'RaceDay.Api.Tests/**'
      - 'RaceDay.slnx'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore RaceDay.slnx

      - name: Build
        run: dotnet build RaceDay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal